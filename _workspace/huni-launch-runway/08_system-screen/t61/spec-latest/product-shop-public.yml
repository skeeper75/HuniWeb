        더보기 방식으로 조회를 원할 경우 displayBrandNo를 추가해주시면 됩니다.(pageNumber는 제외 하고 요청)\n\n ###\
        \ OAUTH2 참고사항\n* [Oauth2 API](https://docs.shopby.co.kr/?url.primaryName=auth/#/OAUTH2/post-oauth2-token)\
        \ 를 사용하여 토큰을 발급받은 경우,\n* 기존 accessToken 대신 Shop-By-Authorization 로 액세스 토큰을\
        \ 전달해야합니다.\n* ex) Shop-By-Authorization : Bearer test-access-token\n"
      operationId: get-display-like-brands
      parameters:
      - name: pageNumber
        in: query
        description: 페이지 번호^|1
        required: false
        schema:
          type: number
      - name: pageSize
        in: query
        description: 한 페이지당 노출 수^|10
        required: false
        schema:
          type: number
      - name: displayBrandNo
        in: query
        description: 브랜드 번호^|123
        required: false
        schema:
          type: number
      - name: Version
        in: header
        description: API 버전^|1.0
        required: true
        schema:
          type: string
        example: "1.0"
      - name: clientId
        in: header
        description: 쇼핑몰 클라이언트 아이디^|test-client-id
        required: true
        schema:
          type: string
        example: test-client-id
      - name: platform
        in: header
        description: "PC - PC 웹 브라우저에서 접근 시, MOBILE_WEB - 모바일 웹 브라우저에서 접근 시, AOS -\
          \ Android 앱에서 접근 시, IOS - iOS 앱에서 접근 시^|PC"
        required: true
        schema:
          type: string
        example: PC
      - name: language
        in: header
        description: "언어 (기본값: ko, 지원: en - 영어, jp - 일본어, zh - 중국어) (nullable)^|en"
        required: false
        schema:
          type: string
      responses:
        "200":
          description: "200"
          content:
