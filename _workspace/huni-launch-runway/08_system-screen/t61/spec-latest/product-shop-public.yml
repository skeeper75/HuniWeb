openapi: 3.0.1
info:
  title: product-shop
  description: ' 상품(product)관련 shop API입니다.'
  version: 0.0.1-SNAPSHOT
servers:
- url: https://shop-api.shopby.co.kr
tags:
- name: Brand
  description: 브랜드
- name: Product
  description: 상품
- name: Free Gift
  description: 사은품
- name: Profile
  description: 프로필 (회원)
- name: Additional Discount
  description: 추가할인
- name: Custom Property
  description: 상품 추가 항목
- name: Configuration
  description: 설정
paths:
  /additional-discounts/by-product-no:
    get:
      tags:
      - Additional Discount
      summary: 추가할인 정보 조회하기
      description: "## 부가설명 및 특이사항\n            \n상품번호로 추가할인 정보 조회하는 API입니다\n\n ###\
        \ OAUTH2 참고사항\n* [Oauth2 API](https://docs.shopby.co.kr/?url.primaryName=auth/#/OAUTH2/post-oauth2-token)\
        \ 를 사용하여 토큰을 발급받은 경우,\n* 기존 accessToken 대신 Shop-By-Authorization 로 액세스 토큰을\
        \ 전달해야합니다.\n* ex) Shop-By-Authorization : Bearer test-access-token\n\n ---\n\
        \ ## [구매수량할인 사용시]\n ### 구매수량할인 정액할인: (옵션금액 - 정액할인금액) * 수량\n 예시) 옵션금액 100원\
        \ 일때, 옵션단위 5개 이상 10개 미만 구매시 __50원__ 할인\n | 상품(옵션) | 구매수량 | 구매수량할인 | 구매수량할인\
        적용 | 최종금액 |\n | -------- | ------- | ------- | ------- | ------- |\n | 볼펜\
        (빨강) | 3 | 적용불가 | - | 300 |\n | 볼펜(검정) | 5 | 적용가능 | (100-50) * 5 | 250 |\n\
        \ | 볼펜(파랑) | 10 | 적용불가 | - | 1000 |\n ---\n ### 구매수량할인 정률할인: (옵션금액 * 수량) *\
        \ (100 - 정률할인)%\n 예시) 옵션금액 100원 일때, 옵션단위 5개 이상 10개 미만 구매시 __10%__ 할인\n | 상\
        품(옵션) | 구매수량 | 구매수량할인 | 구매수량할인적용 | 최종금액 |\n | -------- | ------- | -------\
        \ | ------- | ------- |\n | 볼펜(빨강) | 3 | 적용불가 | - | 300 |\n | 볼펜(검정) | 5 |\
        \ 적용가능 | (100 * 5) * (100-10)% | 450 |\n | 볼펜(파랑) | 10 | 적용불가 | - | 1000 |\n\
        \n"
      operationId: get-additional-discounts-by-product-no
      parameters:
      - name: productNo
        in: query
        description: 상품번호^|10000001
        required: true
        schema:
          type: number
      - name: Version
        in: header
        description: API 버전^|1.0
        required: true
        schema:
          type: string
        example: "1.0"
      - name: clientId
        in: header
        description: 쇼핑몰 클라이언트 아이디^|test-client-id
        required: true
        schema:
          type: string
        example: test-client-id
      - name: platform
        in: header
        description: "PC - PC 웹 브라우저에서 접근 시, MOBILE_WEB - 모바일 웹 브라우저에서 접근 시, AOS -\
          \ Android 앱에서 접근 시, IOS - iOS 앱에서 접근 시^|PC"
        required: true
        schema:
          type: string
        example: PC
      - name: language
        in: header
        description: "언어 (기본값: ko, 지원: en - 영어, jp - 일본어, zh - 중국어) (nullable)^|en"
        required: false
        schema:
          type: string
      - name: accessToken
        in: header
        description: 회원 엑세스 토큰^|test-access-token
        required: false
        schema:
          type: string
      - name: Shop-By-Authorization
        in: header
        description: 액세스 토큰(Oauth2 스펙)^|Bearer test-access-token
        required: false
        schema:
          type: string
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/additional-discounts-by-product-no560564796'
              examples:
                get-additional-discounts-by-product-no:
                  value: "{\"productNo\":10000001,\"discountNo\":1,\"discountName\"\
                    :\"추가할인\",\"minSalePrice\":null,\"maxSalePrice\":null,\"isFixedDiscount\"\
                    :true,\"discountAmount\":1000,\"discountRate\":null,\"maxDiscountAmount\"\
                    :null,\"isQuantityDiscount\":true,\"startDateTime\":\"2023-11-21\
                    \ 00:00:00\",\"endDateTime\":\"2023-11-24 23:59:59\",\"quantityDiscountInfos\"\
                    :[{\"sortNo\":1,\"minQuantity\":1,\"maxQuantity\":null,\"isFixedDiscount\"\
                    :true,\"discountAmount\":1000,\"discountRate\":null,\"maxDiscountAmount\"\
                    :null}],\"isMemberDiscount\":false,\"memberDiscountInfos\":[{\"\
                    sortNo\":1,\"memberGroupTargetType\":null,\"memberGradeTargetType\"\
                    :null,\"memberGroupNos\":[],\"memberGradeNos\":[],\"isFixedDiscount\"\
                    :true,\"discountAmount\":1000,\"discountRate\":null,\"maxDiscountAmount\"\
                    :null}]}"
  /additional-discounts/by-product-nos:
    get:
      tags:
      - Additional Discount
      summary: 추가할인 정보 다건 조회하기
      description: "## 부가설명 및 특이사항\n            \n상품번호(다건)로 추가할인 정보 조회하는 API입니다\n\n\
        상품번호 최대개수는 100건 입니다.\n\n ### OAUTH2 참고사항\n* [Oauth2 API](https://docs.shopby.co.kr/?url.primaryName=auth/#/OAUTH2/post-oauth2-token)\
        \ 를 사용하여 토큰을 발급받은 경우,\n* 기존 accessToken 대신 Shop-By-Authorization 로 액세스 토큰을\
        \ 전달해야합니다.\n* ex) Shop-By-Authorization : Bearer test-access-token\n\n ---\n\
        \ ## [구매수량할인 사용시]\n ### 구매수량할인 정액할인: (옵션금액 - 정액할인금액) * 수량\n 예시) 옵션금액 100원\
        \ 일때, 옵션단위 5개 이상 10개 미만 구매시 __50원__ 할인\n | 상품(옵션) | 구매수량 | 구매수량할인 | 구매수량할인\
        적용 | 최종금액 |\n | -------- | ------- | ------- | ------- | ------- |\n | 볼펜\
        (빨강) | 3 | 적용불가 | - | 300 |\n | 볼펜(검정) | 5 | 적용가능 | (100-50) * 5 | 250 |\n\
        \ | 볼펜(파랑) | 10 | 적용불가 | - | 1000 |\n ---\n ### 구매수량할인 정률할인: (옵션금액 * 수량) *\
        \ (100 - 정률할인)%\n 예시) 옵션금액 100원 일때, 옵션단위 5개 이상 10개 미만 구매시 __10%__ 할인\n | 상\
        품(옵션) | 구매수량 | 구매수량할인 | 구매수량할인적용 | 최종금액 |\n | -------- | ------- | -------\
        \ | ------- | ------- |\n | 볼펜(빨강) | 3 | 적용불가 | - | 300 |\n | 볼펜(검정) | 5 |\
        \ 적용가능 | (100 * 5) * (100-10)% | 450 |\n | 볼펜(파랑) | 10 | 적용불가 | - | 1000 |\n\
        \n"
      operationId: get-additional-discounts-by-product-nos
      parameters:
      - name: productNos
        in: query
        description: 상품번호 리스트^|10000001
        required: true
        schema:
          type: string
      - name: Version
        in: header
        description: API 버전^|1.0
        required: true
        schema:
          type: string
        example: "1.0"
      - name: clientId
        in: header
        description: 쇼핑몰 클라이언트 아이디^|test-client-id
        required: true
        schema:
          type: string
        example: test-client-id
      - name: platform
        in: header
        description: "PC - PC 웹 브라우저에서 접근 시, MOBILE_WEB - 모바일 웹 브라우저에서 접근 시, AOS -\
          \ Android 앱에서 접근 시, IOS - iOS 앱에서 접근 시^|PC"
        required: true
        schema:
          type: string
        example: PC
      - name: language
        in: header
        description: "언어 (기본값: ko, 지원: en - 영어, jp - 일본어, zh - 중국어) (nullable)^|en"
        required: false
        schema:
          type: string
      - name: accessToken
        in: header
        description: 회원 엑세스 토큰^|test-access-token
        required: false
        schema:
          type: string
      - name: Shop-By-Authorization
        in: header
        description: 액세스 토큰(Oauth2 스펙)^|Bearer test-access-token
        required: false
        schema:
          type: string
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/additional-discounts-by-product-nos660569214'
              examples:
                get-additional-discounts-by-product-nos:
                  value: "{\"data\":[{\"productNo\":10000001,\"discountNo\":1,\"discountName\"\
                    :\"추가할인\",\"minSalePrice\":null,\"maxSalePrice\":null,\"isFixedDiscount\"\
                    :true,\"discountAmount\":1000,\"discountRate\":null,\"maxDiscountAmount\"\
                    :null,\"isQuantityDiscount\":true,\"startDateTime\":\"2023-11-21\
                    \ 00:00:00\",\"endDateTime\":\"2023-11-24 23:59:59\",\"quantityDiscountInfos\"\
                    :[{\"sortNo\":1,\"minQuantity\":1,\"maxQuantity\":null,\"isFixedDiscount\"\
                    :true,\"discountAmount\":1000,\"discountRate\":null,\"maxDiscountAmount\"\
                    :null}],\"isMemberDiscount\":false,\"memberDiscountInfos\":[{\"\
                    sortNo\":1,\"memberGroupTargetType\":null,\"memberGradeTargetType\"\
                    :null,\"memberGroupNos\":[],\"memberGradeNos\":[],\"isFixedDiscount\"\
                    :true,\"discountAmount\":1000,\"discountRate\":null,\"maxDiscountAmount\"\
                    :null}]}]}"
  /display/brands:
    get:
      tags:
      - Brand
      summary: 브랜드 목록 조회하기 - 상품 색인 기준
      description: "## 부가설명 및 특이사항\n            \n브랜드 목록 조회하는 API입니다\n\nPaging 기능\
        \ 제공합니다\n\n상품 색인(ES) 기준으로, 현재 상품에 노출/검색되는 브랜드 목록을 조회합니다.\n\n ### OAUTH2 참고\
        사항\n* [Oauth2 API](https://docs.shopby.co.kr/?url.primaryName=auth/#/OAUTH2/post-oauth2-token)\
        \ 를 사용하여 토큰을 발급받은 경우,\n* 기존 accessToken 대신 Shop-By-Authorization 로 액세스 토큰을\
        \ 전달해야합니다.\n* ex) Shop-By-Authorization : Bearer test-access-token\n"
      operationId: get-display-brands
      parameters:
      - name: filter.name
        in: query
        description: 검색할 브랜드명^|브랜드명
        required: false
        schema:
          type: string
      - name: filter.categoryNos
        in: query
        description: "검색할 카테고리 번호 목록 (콤마 구분, 최대 20개)^|10000,10001"
        required: false
        schema:
          type: string
      - name: filter.soldOutIncluded
        in: query
        description: "품절 상품 포함 여부(default: false)^|false"
        required: false
        schema:
          type: boolean
      - name: filter.saleStatus
        in: query
        description: "판매 상태 ( 전체 판매 상태 조회: ALL_CONDITIONS, 판매대기와 판매중 상품 조회: READY_ONSALE,\
          \ 판매중 상품만 조회: ONSALE - default, 예약판매중인 상품과 판매중인 상품만 조회: RESERVATION_AND_ONSALE)^|ALL_CONDITIONS"
        required: false
        schema:
          type: string
      - name: pageNumber
        in: query
        description: 페이지 번호^|1
        required: false
        schema:
          type: number
      - name: pageSize
        in: query
        description: 한 페이지당 노출 수^|10
        required: false
        schema:
          type: number
      - name: hasTotalCount
        in: query
        description: "전체 브랜드 수 포함 여부(default: false)^|true"
        required: false
        schema:
          type: boolean
      - name: sort.criterion
        in: query
        description: "정렬 필드 (null 또는 값 없음(default) - 브랜드명 가나다순 / PRODUCT_COUNT - 브\
          랜드 상품 매핑 수로 정렬 후, 브랜드 가나다순 / REGISTER_DATE - 등록일순)^|PRODUCT_COUNT"
        required: false
        schema:
          type: string
      - name: sort.direction
        in: query
        description: "정렬 방식 (ASC - 오름차순, DESC - 내림차순 / 정렬 필드가 있는 경우에만 적용됩니다.)^|DESC"
        required: false
        schema:
          type: string
      - name: Version
        in: header
        description: API 버전^|1.0
        required: true
        schema:
          type: string
        example: "1.0"
      - name: clientId
        in: header
        description: 쇼핑몰 클라이언트 아이디^|test-client-id
        required: true
        schema:
          type: string
        example: test-client-id
      - name: platform
        in: header
        description: "PC - PC 웹 브라우저에서 접근 시, MOBILE_WEB - 모바일 웹 브라우저에서 접근 시, AOS -\
          \ Android 앱에서 접근 시, IOS - iOS 앱에서 접근 시^|PC"
        required: true
        schema:
          type: string
        example: PC
      - name: language
        in: header
        description: "언어 (기본값: ko, 지원: en - 영어, jp - 일본어, zh - 중국어) (nullable)^|en"
        required: false
        schema:
          type: string
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/display-brands-1730126954'
              examples:
                get-display-brands:
                  value: "{\"items\":[{\"brandNo\":1,\"displayBrandNo\":1,\"name\"\
                    :\"브랜드 이름\",\"nameKo\":\"브랜드 이름\",\"nameEn\":\"brand name\",\"\
                    nameType\":\"NAME_KO\",\"makerName\":\"제작사\",\"logoImageUrl\"\
                    :\"logo image url\",\"homepageUrl\":\"homepage url\",\"mainImageContent\"\
                    :\"메인 내용\",\"detailContent\":\"상세 내용\",\"description\":\"설명\"\
                    ,\"displayAreaContentUrl\":\"브랜드 이미지 또는 브랜드 관련 동영상 url\",\"mainBrandName\"\
                    :\"브랜드 이름\",\"subBrandName\":\"brand name\"}],\"totalCount\":10}"
  /display/brands/extraInfo:
    get:
      tags:
      - Brand
      summary: 브랜드 추가 정보 조회하기
      description: "## 부가설명 및 특이사항\n            \n### 브랜드 추가정보 조회하는 API입니다.\n- 브랜드\
        \ 요청 번호는 최대 30개 까지 가능합니다.\n\n ### OAUTH2 참고사항\n* [Oauth2 API](https://docs.shopby.co.kr/?url.primaryName=auth/#/OAUTH2/post-oauth2-token)\
        \ 를 사용하여 토큰을 발급받은 경우,\n* 기존 accessToken 대신 Shop-By-Authorization 로 액세스 토큰을\
        \ 전달해야합니다.\n* ex) Shop-By-Authorization : Bearer test-access-token\n"
      operationId: get-display-brand-extra-info
      parameters:
      - name: displayBrandNos
        in: query
        description: "전시 브랜드 번호^|1, 2, 3"
        required: true
        schema:
          type: number
      - name: Version
        in: header
        description: API 버전^|1.0
        required: true
        schema:
          type: string
        example: "1.0"
      - name: clientId
        in: header
        description: 쇼핑몰 클라이언트 아이디^|test-client-id
        required: true
        schema:
          type: string
        example: test-client-id
      - name: platform
        in: header
        description: "PC - PC 웹 브라우저에서 접근 시, MOBILE_WEB - 모바일 웹 브라우저에서 접근 시, AOS -\
          \ Android 앱에서 접근 시, IOS - iOS 앱에서 접근 시^|PC"
        required: true
        schema:
          type: string
        example: PC
      - name: language
        in: header
        description: "언어 (기본값: ko, 지원: en - 영어, jp - 일본어, zh - 중국어) (nullable)^|en"
        required: false
        schema:
          type: string
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/display-brands-extraInfo1842411303'
              examples:
                get-display-brand-extra-info:
                  value: "[{\"displayBrandNo\":1,\"extraInfo\":\"ExtraInfo\"}]"
  /display/brands/like-brands:
    get:
      tags:
      - Profile
      summary: 브랜드 좋아요 목록 전체 조회하기
