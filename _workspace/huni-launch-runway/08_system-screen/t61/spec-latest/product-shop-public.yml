        description: "언어 (기본값: ko, 지원: en - 영어, jp - 일본어, zh - 중국어) (nullable)^|en"
        required: false
        schema:
          type: string
      - name: accessToken
        in: header
        description: 회원 엑세스 토큰^|test-access-token
        required: false
        schema:
          type: string
        example: test-access-token
      - name: Shop-By-Authorization
        in: header
        description: 액세스 토큰(Oauth2 스펙)^|Bearer test-access-token
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/products-restock-1480926968'
            examples:
              post-restock:
                value: "{\"optionNos\":[1,2],\"privacyInfoAgreement\":true,\"usesMemberInfo\"\
