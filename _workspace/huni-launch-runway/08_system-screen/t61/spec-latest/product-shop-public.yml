  /products/custom-properties/usage:
    get:
      tags:
      - Custom Property
      summary: 상품항목값별 적용상품 존재여부 조회하기
      description: "## 부가설명 및 특이사항\n            \n요청한 상품항목값에 적용된 상품이 있는지 조회하는 API입\
        니다\n\n요청한 상품항목값 번호는 모두 응답에 포함됩니다.\n\n적용 상품은 해당 몰에서 프론트에 노출 가능한 상품만 집계합니다.\
        \ 아래 상품은 제외됩니다.\n\n* 삭제된 상품\n\n* 판매금지 상품\n\n* 판매기간이 종료된 상품\n\n* 판매 가능한 승인상\
        태가 아닌 상품\n\n* 전시하지 않는 상품\n\n* URL 직접 접근만 허용된 상품\n\n* 요청 플랫폼에 전시하지 않는 상품\n\n\
        적용 상품이 없거나 존재하지 않는 번호이면 false 입니다.\n\npropertyValueNos는 최대 100개까지 요청 가능합니다\
        .\n\n ### OAUTH2 참고사항\n* [Oauth2 API](https://docs.shopby.co.kr/?url.primaryName=auth/#/OAUTH2/post-oauth2-token)\
        \ 를 사용하여 토큰을 발급받은 경우,\n* 기존 accessToken 대신 Shop-By-Authorization 로 액세스 토큰을\
        \ 전달해야합니다.\n* ex) Shop-By-Authorization : Bearer test-access-token\n"
      operationId: get-custom-property-usage
      parameters:
      - name: propertyValueNos
        in: query
        description: "상품항목값 번호 목록 (콤마 구분, 최대 100개)^|15519,16414"
        required: true
        schema:
          type: string
      - name: Version
        in: header
        description: API 버전^|1.0
        required: true
        schema:
          type: string
        example: "1.0"
      - name: clientId
        in: header
        description: 쇼핑몰 클라이언트 아이디^|test-client-id
        required: true
        schema:
          type: string
        example: test-client-id
      - name: platform
        in: header
        description: "PC - PC 웹 브라우저에서 접근 시, MOBILE_WEB - 모바일 웹 브라우저에서 접근 시, AOS -\
          \ Android 앱에서 접근 시, IOS - iOS 앱에서 접근 시^|PC"
        required: true
        schema:
          type: string
        example: PC
      - name: language
        in: header
        description: "언어 (기본값: ko, 지원: en - 영어, jp - 일본어, zh - 중국어) (nullable)^|en"
        required: false
        schema:
          type: string
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/products-custom-properties-usage992368343'
              examples:
                get-custom-property-usage:
                  value: "{\"usages\":[{\"propertyValueNo\":15519,\"hasAppliedProduct\"\
                    :true},{\"propertyValueNo\":16414,\"hasAppliedProduct\":false}]}"
