      description: "## 부가설명 및 특이사항\n            \n재입고 알림 신청하는 API입니다\n\n ---\n ##\
        \ [회원정보로 신청(usesMemberInfo = true) 시 실패 응답]\n 회원정보에 신청에 필요한 이름/휴대폰번호가 없으면\
        \ HTTP 400 과 함께 `code` = `SPEC0003` 으로 응답하며,\n 실패 사유는 `result.detail` 에 `사\
        유코드 : 안내 메시지` 형태로 내려갑니다.\n | 사유 코드 | 안내 메시지 | 발생 조건 |\n | -------- | -------\
        \ | ------- |\n | EMPTY_MEMBER_NAME | 회원정보에 이름이 없어 재입고 알림을 신청할 수 없습니다. | 회\
        원정보에 이름이 없는 경우 |\n | EMPTY_MEMBER_PHONE | 회원정보에 휴대폰번호가 없어 재입고 알림을 신청할 수 없습\
        니다. | 간편로그인 회원 등 회원정보에 휴대폰번호가 없는 경우 |\n | INVALID_MEMBER_PHONE | 회원정보의 휴대폰\
        번호 형식이 올바르지 않아 재입고 알림을 신청할 수 없습니다. | 회원정보의 휴대폰번호를 전화번호로 인식할 수 없는 경우 |\n\n\
        \ * 회원정보만으로는 신청할 수 없는 상태이므로, 회원정보를 수정하도록 안내하거나 usesMemberInfo 를 false 로 하여\
        \ 신청자명/휴대폰번호를 직접 입력받는 신청 플로우로 처리해야 합니다.\n * 액세스 토큰이 없거나 회원 정보를 찾을 수 없는 경우에\
        는 `code` = `PRDS0003`, `message` = `회원 정보가 존재하지 않습니다.` 로 응답합니다.\n\n\n ###\
        \ OAUTH2 참고사항\n* [Oauth2 API](https://docs.shopby.co.kr/?url.primaryName=auth/#/OAUTH2/post-oauth2-token)\
        \ 를 사용하여 토큰을 발급받은 경우,\n* 기존 accessToken 대신 Shop-By-Authorization 로 액세스 토큰을\
        \ 전달해야합니다.\n* ex) Shop-By-Authorization : Bearer test-access-token\n"
      operationId: post-restock
      parameters:
      - name: Version
        in: header
        description: API 버전^|1.0
        required: true
        schema:
          type: string
        example: "1.0"
      - name: clientId
        in: header
        description: 쇼핑몰 클라이언트 아이디^|test-client-id
        required: true
        schema:
          type: string
