<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>주문 이후 생산·출고 프로세스</title>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
<style>
:root{--bg:#f7f7f5;--fg:#1c1b19;--mut:#6b6864;--line:#e0ddd8;--card:#fff;
--a:#8b5cf6;--bad:#ef4444;--warn:#f59e0b;--ok:#10b981;--acc:#2563eb}
:root:not([data-theme="light"]){}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17161a;--fg:#ecebe8;
--mut:#9b9792;--line:#302e33;--card:#1f1e23}}
:root[data-theme="dark"]{--bg:#17161a;--fg:#ecebe8;--mut:#9b9792;--line:#302e33;--card:#1f1e23}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
font:15px/1.65 -apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo",sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:32px 16px 96px}
h1{font-size:26px;margin:0 0 6px;letter-spacing:-.01em}
.sub{color:var(--mut);font-size:13px;margin-bottom:24px}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:28px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.stat b{font-size:20px;display:block;line-height:1.2}
.stat span{font-size:11px;color:var(--mut)}
.tree{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:28px}
.tree h2{font-size:14px;margin:0 0 12px;color:var(--mut);font-weight:600}
.l1{margin:10px 0 4px;font-weight:600;font-size:14px}
.l2{margin-left:14px;color:var(--mut);font-size:13px}
.l3s{margin:4px 0 0 28px;display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:999px;
padding:4px 11px;font-size:12px;cursor:pointer;font-family:inherit}
.chip:hover{border-color:var(--a)}
.chip.on{background:var(--a);border-color:var(--a);color:#fff}
.badge{display:inline-block;min-width:18px;text-align:center;border-radius:999px;
padding:1px 6px;font-size:10px;margin-left:5px;background:var(--bad);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:16px}
.card h3{margin:0 0 4px;font-size:17px}
.one{color:var(--mut);font-size:13px;margin:0 0 14px}
.meta{font-size:11px;color:var(--mut);margin-bottom:12px}
.tag{border:1px solid var(--line);border-radius:5px;padding:1px 6px;margin-right:5px}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
.diag{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;margin:10px 0;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--mut);font-weight:600;font-size:11px}
td.rid{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;white-space:nowrap}
.s{border-radius:4px;padding:1px 6px;font-size:10px;white-space:nowrap}
.s-작동{background:var(--ok);color:#fff}
.s-부분{background:var(--warn);color:#17161a}
.s-미착수{background:var(--line);color:var(--mut)}
.s-미실측{background:var(--bad);color:#fff}
.s-없음{background:var(--bad);color:#fff}
.xr{opacity:.62}
.gp{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.gp h4{margin:0 0 8px;font-size:12px;color:var(--mut)}
.g{font-size:12px;margin-bottom:7px;padding-left:10px;border-left:2px solid var(--line)}
.g .k{font-size:10px;border-radius:4px;padding:1px 5px;margin-right:6px}
.k가{background:#8b5cf6;color:#fff}.k나{background:var(--bad);color:#fff}
.k다{background:var(--warn);color:#17161a}.k라{background:var(--acc);color:#fff}
.g .w{color:var(--mut);font-size:11px}
a.doc{font-size:11px;color:var(--acc);text-decoration:none}
.hidden{display:none}
@media(max-width:640px){.wrap{padding:20px 16px 72px}h1{font-size:21px}table{font-size:11px}}
</style></head><body><div class="wrap">

ereq": "없음"}, {"id": "G-038", "kind": "라 결정 미정", "text": "디자인파일여부 Y/N 운영 기준 — 누가: 최숙진 + MES 담당", "owner": "최숙진", "basis": "②본문 §5 항목 셀의 담당 표기", "prereq": ""}, {"id": "G-039", "kind": "라 결정 미정", "text": "판걸이 값의 단일 출처(우리 vs MES) — 누가: 서희항+최숙진 — 원장에 행이 없는 결정", "owner": "서희항", "basis": "②본문 §5 항목 셀의 담당 표기", "prereq": ""}], "oneline": "고객이 준 원고를 인쇄기에 걸 수 있는 파일로 만들어(원본 그대로 쓸지 가공할지 → AI→PDF 변환 → 인쇄/칼선 분리 → 조판 → 파일명 → 폴더) 공정팀이 집어갈 자리에 두기까지.", "diagrams": ["sequenceDiagram\n    autonumber\n    participant O as 우리(order 버킷)\n    participant M as 접수담당자\n    participant MES as MES\n    participant ED as Edicus Prepress\n    participant FS as 공정 파일서버\n    participant T as 공정팀\n\n    O-->>MES: 원고 최신 회차 키 (P06 MES-1 에 실려서)\n    M->>MES: 접수파일 등록\n    alt 품목관리 디자인파일여부 = Y\n        MES->>MES: 원본 그대로 자동 접수\n    else 가공 필요\n        M->>MES: 원본 AI → PDF 변환 업로드\n        M->>MES: 인쇄파일 / 칼선파일 분리 등록(공정별)\n    end\n    alt 편집기 상품\n        ED-->>MES: Prepress 렌더링 결과 접수파일 등록\n        M->>ED: 수정요청 ↔ 수정완료 왕복\n    end\n    MES->>MES: 인쇄공정 파일 기준 썸네일 자동 생성\n    Note over M,MES: AI 접수파일은 썸네일용 JPG 동반 업로드<br/>(아크릴스티커·박)\n    M->>MES: 조판 — 판걸이 + 아이마크\n    alt 아크릴\n        M->>MES: 원판 배치 조판(396x480 · 도수 구분 · 돔보)\n    else 다도안\n        M->>MES: 판걸이·건수·수량 기준 조판\n    else 수동\n        M->>MES: 여러 주문 취합(틴거울/아크릴/자석북마크)\n    end\n    MES->>MES: 파일명 자동 RENAME<br/>품목_출력사이즈_양단면_소재_거래처_고객_고유번호_수량\n    MES->>FS: 공정별 폴더(년도>발주일자) 자동 배치\n    FS-->>T: 팀별·담당자별 분리 전달\n", "flowchart TD\n    A[\"검판 통과 원고\"] --> B{\"품목관리<br/>디자인파일여부\"}\n    B -->|\"Y\"| C[\"원본 그대로 자동 접수\"]\n    B -->|\"N\"| D[\"가공 후 등록\"]\n    D --> D1[\"AI → PDF 변환\"]\n    D1 --> D2[\"인쇄파일 / 칼선파일 분리\"]\n    A --> E{\"편집기 상품인가\"}\n    E -->|\"예\"| E1[\"Edicus Prepress 렌더링 결과 등록\"]\n    E1 --> E2{\"수정 필요\"}\n    E2 -->|\"예\"| E3[\"수정요청 → 고객 → 수정완료 왕복\"]\n    E3 --> E1\n    C --> F[\"썸네일 자동 생성\"]\n    D2 --> F\n    E2 -->|\"아니오\"| F\n    F --> G{\"조판 방식\"}\n    G -->|\"일반\"| G1[\"판걸이 + 아이마크\"]\n    G -->|\"아크릴\"| G2[\"원판 배치 396x480 · 돔보\"]\n    G -->|\"다도안\"|  MES 쪽.", "owner": "최숙진", "basis": "① 원장 owner_proposed(STD-MFG-084·STD-ADO-012)", "prereq": ""}, {"id": "G-057", "kind": "다 코드는 있는데 연결 안 됨", "text": "공정 마스터 2행(`082`·`083`) — 이 프로세스에서 유일하게 「작동」인 두 행이다. 계층·상세옵션·면별선택·필수여부·허용범위가 전부 webadmin 에 있고 위젯·가격엔진이 쓴다. 생산 쪽으로 나가는 통로만 없다", "owner": "서희항", "basis": "②단계표 §4 최근접 단계의 담당자", "prereq": "G-27"}, {"id": "G-058", "kind": "다 코드는 있는데 연결 안 됨", "text": "MES 공정 실적 등록 — 바코드 기반 공정상태 갱신 인터페이스가 MES 에 이미 있다. 후니 작업이 그 안에 안 들어갈 뿐", "owner": "최숙진", "basis": "②단계표 §4 최근접 단계의 담당자", "prereq": ""}, {"id": "G-059", "kind": "라 결정 미정", "text": "공정 정의의 단일 출처(webadmin vs MES 라우트) — 누가: 서희항+최숙진 — 원장에 행이 없는 결정", "owner": "서희항", "basis": "②본문 §5 항목 셀의 담당 표기", "prereq": ""}, {"id": "G-060", "kind": "라 결정 미정", "text": "18케이스 라우트의 실제 목록 — 누가: 최숙진 — 정의하는 일(`STD-MFG-084`)", "owner": "최숙진", "basis": "① 원장 owner_proposed(STD-MFG-084)", "prereq": ""}, {"id": "G-061", "kind": "라 결정 미정", "text": "7팀 파트 구분 확정 — 누가: 최숙진", "owner": "최숙진", "basis": "②본문 §5 항목 셀의 담당 표기", "prereq": ""}, {"id": "G-062", "kind": "라 결정 미정", "text": "interlock 유무 — 누가: MES 담당 회신(`STD-MFG-090`)", "owner": "외부(상대측 회신 대기)", "basis": "① 원장 owner_proposed(STD-MFG-090)", "prereq": ""}], "oneline": "MES 가 접수한 작업이 공정 라우트를 따라 팀을 옮겨 다니며 완료 신호를 쌓아 생산완료가 되기까지.", "diagrams": ["sequenceDiagram\n    autonumber\n    participant M as 접수담당자\n    participant MES as MES\n    participant R as 공정라우트\n    participant T1 as 앞공정 팀\n    participant T2 as 뒷공정 팀\n    participant FS as 파일서버\n\n    M->>MES: 출고예정일(완료예정일) 등록\n    M->>MES: 생산메모 입력\n    M->>MES: 작업의뢰서 출력(대표썸네일 · EXCEL)\n    MES->>MES: 처리표시(빨간점) + 주문상태 「제작중」\n    MES->>R: 상품 → 공정라우트 매핑 조회\n    R-->>MES: 라우트 단계(순번·공정·필수선택·담당팀)\n    MES-->>T1: 파일 다운로드 권한 열림<br/>(제작중 AND 생산다운여부=Y)\n    T1->>FS: 파일 다운로드\n    FS-->>MES: 다운로드완료 상태 자동 전환\n    T1->>MES: 공정 완료 신호(출력완료·커팅완료…)\n    MES->>MES: 팀 간 출고 처리\n    MES->>T2: 팀 간 입고 처리(봉제미싱·아크릴가공·제본·박작업)\n    T2->>MES: 앞공정 미완료면 차단(interlock)\n    T2->>MES: 공정 완료 신호\n    MES->>MES: 마지막 공정 완료 → 생산완료 → P10\n", "flowchart TD\n    A[\"MES 접수완료\"] --> B[\"출고예정일 · 생산메모\"]\n    B --> C[\"작업의뢰서 출력\"]\n    C --> D[\"빨간점 + 주문상태 제작중\"]\n    D --> E{\"상품 → 공정라우트<br/>매핑 있나\"}\n    E -->|\"없다\"| E1[\"라우트 없음 — 수동 진행\"]\n    E -->|\"있다\"| F[\"라우트 단계 순서대로\"]\n    F --> G{\"파일 다운로드 권한<br/>제작중 AND 생산다운여부=Y\"}\n    G -->|\"아니오\"| G1[\"팀이 파일을 못 받음\"]\n    G -->|\"예\"| H[\"다운로드 → 다운로드완료 자동 전환\"]\n    H --> I[\"공정 작업\"]\n    I --> J{\"앞공정 미완료인가\"}\n    J -->|\"예\"| J1[\"❌ 다음공정 차단(interlock)\"]\n    J -->|\"아니오\"| K[\"공정 완료 신호\"]\n    K --> L{\"팀이 바뀌나\"}\n    L -->|\"예\"| M[\"팀 간 출고 → 입고\"]\n    M --> I\n    L -->|\"아니오\"| N{\"마지막 공정인가\"}\n    N -->|\"아니오\"| I\n    N -->|\"예\"| O[\"생산완료 → P10\"]\n    I -->|\"불량\"| P[\"불량 판정 → 재작업 지시 → P12\"]\n    subgraph 취소\n    X[\"이 구간의 취소는 자동 처리 금지<br/>담당자 에스컬레이션 → P13\"]\n    end\n    classDef ext stroke:#f59e0b,stroke-width:3px\n    class J1 ext\n"], "doc": "processes/P07-생산공정진행.md"}, {"id": "P08", "full": "P08-외주발주-입고", "name": "외주발주-입고", "l1": "운영자·주문운영", "l2": "외주", "steps": [{"row_id": "STD-ADO-017", "title": "외주 발주 등록·관리", "status": "미착수", "owner": "최숙진", "step": "C5", "own": "담당", "cross": "", "src": "canon+ledger"}, {"row_id": "STD-ADO-018", "title": "외주 입고 전수검수 기록", "status": "미착수", "owner": "최숙진", "step": "C5", "own": "담당", "cross": "", "src": "canon+ledger"}, {"row_id": "STD-ADO-019", "title": "외주 정산(월 마감)", "status": "미착수", "owner": "최숙진", "step": "C5", "own": "담당", "cross": "", "src": "canon+ledger"}, {"row_id": "STD-MFG-100", "title": "외주처별 발주서 생성(접수파일 취합)", "status": "미착수", "owner": "최숙진", "step": "C5", "own": "담당", "cross": "", "src": "ledger전용"}, {"row_id": "STD-MFG-101", "title": "책자 상품 수량·크기 기준 선택적 외주 판단", "status": "미착수", "owner": "최숙진", "step": "C5", "own": "담당", "cross": "", "src": "ledger전용"}, {"row_id": "STD-MFG-102", "title": "외주 파일 다운로드·업체 포맷 변환·웹하드 업로드", "status": "미착수", "owner": "최숙진", "step": "C5", "own": "담당", "cross": "", "src": "ledger전용"}, {"row_id": "STD-MFG-103", "title": "외주공정 주문리스트·외주처별 생산리스트", "status": "미착수", "owner": "최숙진", "st document.getElementById("stats").innerHTML = [
  [uniq.length,"담당 기능 행"],[D.length,"프로세스"],[0,"미귀속"],[gapN,"빠진 곳"],
  [uniq.filter(r=>D.some(p=>p.steps.some(s=>s.row_id===r&&["미착수","없음","미실측"].includes(s.status)))).length,"미착수·없음·미실측"]
].map(([b,s])=>`<div class="stat"><b>${b}</b><span>${s}</span></div>`).join("");

const tb = {};
D.forEach(p=>{ (tb[p.l1] ||= {})[p.l2] ||= []; tb[p.l1][p.l2].push(p); });
document.getElementById("treeb").innerHTML = Object.entries(tb).map(([l1,l2s])=>
  `<div class="l1">${esc(l1)}</div>` + Object.entries(l2s).map(([l2,ps])=>
    `<div class="l2">${esc(l2)}</div><div class="l3s">` + ps.map(p=>
      `<button class="chip" data-p="${p.id}">${p.id} ${esc(p.name)}${p.gaps.length?`<span class="badge">${p.gaps.length}</span>`:""}</button>`
    ).join("") + `</div>`).join("")).join("");

document.getElementById("cards").innerHTML = D.map(p=>`
<div class="card" id="c-${p.id}">
  <h3>${p.id} · ${esc(p.name)}</h3>
  <p class="one">${esc(p.oneline)}</p>
  <div class="meta"><span class="tag">${esc(p.l1)}</span><span class="tag">${esc(p.l2)}</span>
    ${p.cross?`<span class="tag">cross ${esc(p.cross)}</span>`:""}
    <a class="doc" href="${p.doc}">문서 열기 →</a></div>
  ${p.diagrams.map(d=>`<div class="diag"><pre class="mermaid">${esc(d)}</pre></div>`).join("")}
  <div class="tw"><table><thead><tr><th>row_id</th><th>기능</th><th>상태</th><th>담당</th><th>step</th></tr></thead>
  <tbody>${p.steps.map(s=>`<tr class="${s.own==='cross'?'xr':''}">
    <td class="rid">${esc(s.row_id)}${s.cross?` <span class="tag">${esc(s.cross)}</span>`:""}</td>
    <td>${esc(s.title)}</td>
    <td><span class="s s-${esc(s.status||"미착수")}">${esc(s.status||"—")}</span></td>
    <td>${esc(s.owner)}</td><td>${esc(s.step)}</td></tr>`).join("")}</tbody></table></div>
  ${p.gaps.length?`<div class="gp"><h4>빠진 곳 ${p.gaps.length}건</h4>${p.gaps.map(g=>
    `<div class="g"><span class="k k${KIND(g.kind)}">${esc(g.kind)}</span>${esc(g.text)}
     <div class="w">${esc(g.id)} · 제안 담당 ${esc(g.owner)}${g.basis?` <b>[${esc(g.basis.slice(0,1))}]</b> ${esc(g.basis)}`:""} · 선행 ${esc(g.prereq)}</div></div>`).join("")}</div>`:""}
</div>`).join("");

let sel = null;
document.getElementById("treeb").addEventListener("click", e=>{
  const b = e.target.closest(".chip"); if(!b) return;
  const id = b.dataset.p;
  document.querySelectorAll(".chip").forEach(c=>c.classList.toggle("on", c===b && sel!==id));
  sel = sel===id ? null : id;
  D.forEach(p=>document.getElementById("c-"+p.id).classList.toggle("hidden", !!sel && sel!==p.id));
  if(sel) document.getElementById("c-"+sel).scrollIntoView({behavior:"smooth",block:"start"});
});

const dark = matchMedia("(prefers-color-scheme: dark)").matches;
mermaid.initialize({startOnLoad:true, theme: dark?"dark":"neutral", securityLevel:"loose"});
</script></body></html>
