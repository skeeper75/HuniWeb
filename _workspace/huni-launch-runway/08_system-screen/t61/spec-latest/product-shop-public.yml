        required: false
        schema:
          type: string
      - name: excludeCategoryNos
        in: query
        description: "제외할 전시 카테고리 번호(여러개 일 경우 항목 추가, 번호에 속한 모든 하위 카테고리 제외)^|1,2,3,4"
        required: false
        schema:
          type: string
      - name: categoryOperator
        in: query
        description: "전시카테고리 검색 조건 (AND : 모두다 포함, OR : 한개라도 포함), default: OR^|AND"
        required: false
