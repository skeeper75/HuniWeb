        required: false
        schema:
          type: integer
          format: int32
      - name: onlySaleProduct
        in: query
        description: "세일 상품만 조회 여부(default: false)^|false"
        required: false
        schema:
          type: boolean
      - name: onlyAdditionalSaleProduct
        in: query
        description: "추가 할인 상품만 조회 여부(default: false)^|false"
        required: false
        schema:
          type: boolean
      - name: shippingAreaType
        in: query
        description: "배송 구분 (Enum: [ PARTNER: 파트너 배송, MALL: 쇼핑몰 배송 ])^|MALL"
        required: false
        schema:
          type: string
      - name: minAdditionalDiscountAmount
