          \ 결과에서 제외됩니다. (default: false)^|true"
        required: false
        schema:
          type: boolean
      - name: filter.customProperties.propNos
        in: query
        description: "조회할 상품추가항목 번호^|100,101,102"
        required: false
        schema:
          type: string
